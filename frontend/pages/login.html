<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sign in to the VCNITY Community Hub." />
  <meta name="theme-color" content="#444157" />
  <title>Member Login | VCNITY</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="login">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav class="topnav" aria-label="Primary navigation">
    <a class="brand" href="/" aria-label="VCNITY home">
      <img src="/assets/vcnity/VCNITY_logo.png" alt="VCNITY" class="brand-logo" />
    </a>
        <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="primary-navigation"
      aria-label="Open navigation"
    >
      <span class="nav-toggle-line" aria-hidden="true"></span>
      <span class="nav-toggle-line" aria-hidden="true"></span>
      <span class="nav-toggle-line" aria-hidden="true"></span>
    </button>

<div id="primary-navigation" class="nav-links">
      <a href="/">Home</a>
      <a href="/pages/events.html">Events</a>
      <a data-requires="user" href="/pages/members.html">Member Directory</a>
      <a data-requires="user" href="/pages/blogs.html">Knowledge Hub</a>
      <a href="/pages/about.html">About</a>
      <a href="/pages/charter.html">Charter</a>
      <a data-requires="contributor" href="/pages/admin.html">Admin</a>
      <a data-requires="guest" class="nav-login active" href="/pages/login.html">Login</a>
      <button data-requires="user" id="logoutButton" class="link-button nav-login" type="button">Logout</button>
    </div>
  </nav>

  <main id="main-content" class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-heading">
      <p class="eyebrow">Member access</p>
      <h1 id="login-heading">Welcome to VCNITY</h1>
      <p class="muted">Sign in to access the member directory, Knowledge Hub and community-only resources.</p>

      <div data-auth="guest" class="grid one-col">
        <label class="field-label" for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />

        <label class="field-label" for="password">Password</label>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

        <button id="loginButton" type="button">Sign in</button>
      </div>

      <div data-auth="user" class="hidden signed-in-panel">
        <p class="eyebrow">You are signed in</p>
        <p data-user-summary></p>
        <div class="inline-actions">
          <a class="button button-primary" href="/pages/members.html">Open member directory</a>
          <a class="button button-ghost" data-requires="contributor" href="/pages/admin.html">Open admin</a>
        </div>
      </div>

      <p id="loginStatus" class="notice" aria-live="polite"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
